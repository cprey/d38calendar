name: Update calendar page

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; adjust as needed
  workflow_dispatch: {}      # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: echo "${{ secrets.GCAL_CREDENTIALS_B64 }}" | base64 -d > service-account.json

      - name: Compute date range
        id: dates
        env:
          TZ: ${{ vars.TIMEZONE || 'UTC' }}
        run: |
          # Whole current year (Jan 1 - Dec 31) in TIMEZONE
          echo "start=$(date +%Y)-01-01" >> "$GITHUB_OUTPUT"
          echo "end=$(date +%Y)-12-31" >> "$GITHUB_OUTPUT"

      - name: Generate calendar page
        run: |
          mkdir -p public
          python generate_page.py \
            --start "${{ steps.dates.outputs.start }}" \
            --end "${{ steps.dates.outputs.end }}" \
            --calendar-id "${{ vars.CALENDAR_ID }}" \
            --credentials service-account.json \
            --timezone "${{ vars.TIMEZONE || 'UTC' }}" \
            --output public/index.html \
            --title "${{ vars.PAGE_TITLE || 'Calendar' }}"

      - name: Remove credentials
        if: always()
        run: rm -f service-account.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
